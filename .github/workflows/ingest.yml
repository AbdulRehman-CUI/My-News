name: Optional hourly MyNews ingestion

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: mynews-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: github.repository == 'AbdulRehman-CUI/Nascon-26-Submission' && vars.MYNEWS_EXTERNAL_INGEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh deployed news pool
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 65 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://mynews-drab-eight.vercel.app/api/cron/ingest
